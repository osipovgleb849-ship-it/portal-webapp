<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portals Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #7b2cbf, #9d4edd);
            color: white; height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .container {
            width: 90%; max-width: 400px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px; padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }
        .header { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
        .subheader { font-size: 14px; opacity: 0.8; margin-bottom: 20px; }
        .card {
            background: rgba(0, 0, 0, 0.3); border-radius: 15px;
            padding: 10px; margin-bottom: 20px; position: relative;
        }
        .card img { width: 100%; border-radius: 10px; }
        .card-title {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0, 0, 0, 0.5); padding: 5px 10px; border-radius: 10px; font-size: 12px;
        }
        .timer { font-size: 14px; margin-bottom: 20px; opacity: 0.9; }
        .buttons { display: flex; gap: 10px; }
        .btn {
            flex: 1; padding: 15px; border: none; border-radius: 12px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            background: rgba(255, 255, 255, 0.2); color: white; transition: 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-reject { background: rgba(255, 0, 0, 0.3); }
        .btn-accept { background: rgba(0, 255, 0, 0.3); }
        .icon { font-size: 20px; }
        .footer { margin-top: 20px; font-size: 12px; opacity: 0.6; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">🎁 Neko Helmet #6752</div>
        <div class="subheader">Пользователь <b>@seception</b> предлагает вам 200 ⭐️ за коллекционный подарок Neko Helmet #6752.</div>
        
        <div class="timer">Предложение действует еще <span id="timer">5h 59m</span>.</div>
        
        <div class="card">
            <div class="card-title">Telegram | Neko Helmet #6752</div>
            <!-- Замени ссылку на картинку подарка -->
            <img src="https://i.imgur.com/your-nft-image.png" alt="NFT">
        </div>

        <div class="buttons">
            <button class="btn btn-reject" onclick="reject()">
                <span class="icon">✖</span> Отклонить
            </button>
            <button class="btn btn-accept" onclick="accept()">
                <span class="icon">✔</span> Принять
            </button>
        </div>

        <div class="footer">Сделка проходит через <a href="https://t.me/portals" style="color: white;">Portals Market</a></div>
    </div>

    <script>
        let timeLeft = 5 * 60 * 60 + 59 * 60;
        const timerElement = document.getElementById('timer');
        function updateTimer() {
            const hours = Math.floor(timeLeft / 3600);
            const minutes = Math.floor((timeLeft % 3600) / 60);
            timerElement.innerText = `${hours}h ${minutes}m`;
            if (timeLeft > 0) { timeLeft--; setTimeout(updateTimer, 1000); }
        }
        updateTimer();

        function reject() {
            Telegram.WebApp.sendData(JSON.stringify({action: "reject"}));
            Telegram.WebApp.close();
        }
        function accept() {
            Telegram.WebApp.sendData(JSON.stringify({action: "accept"}));
            Telegram.WebApp.close();
        }
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
    </script>
</body>
</html>
